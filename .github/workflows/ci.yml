# CI: tests y build en cada push a tests/master y en cada pull request.
# El deploy (CD) lo hace Cloudflare Pages conectado al repo: master = producción, tests = vista previa (docs/decisions/0006).
name: CI

on:
  push:
    branches: [tests, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
